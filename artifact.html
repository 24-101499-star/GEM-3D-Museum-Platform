<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Artifact | Grand Egyptian Museum</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/artifact.css">

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
    <script src="js/main.js" defer></script>
    <script src="js/artifact.js" defer></script>
</head>
<body>

<header class="site-header">
    <a href="index.html"><img class="logo" src="assets/images/logo.svg" alt="GEM – Grand Egyptian Museum"></a>

    <nav class="main-nav" aria-label="Main">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="collections.html" class="active" aria-current="page">Collections</a></li>
            <li><a href="index.html#visit">Visit</a></li>
            <li><a href="index.html#research">Research</a></li>
            <li><a href="index.html#about">About</a></li>
        </ul>
    </nav>

    <div class="header-actions">
        <button class="search-btn" type="button" aria-label="Search"><img src="assets/images/icon-search.svg" alt=""></button>
        <a href="vr.html" class="btn">Explore VR</a>
    </div>

    <button class="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
        <img src="assets/images/icon-menu.svg" alt="">
    </button>

    <nav class="mobile-menu" id="mobile-menu" aria-label="Mobile" hidden>
        <a href="index.html">Home</a>
        <a href="collections.html" class="active" aria-current="page">Collections</a>
        <a href="index.html#visit">Visit</a>
        <a href="index.html#research">Research</a>
        <a href="index.html#about">About</a>
        <a href="vr.html" class="btn">Explore VR</a>
    </nav>
</header>
<div class="menu-backdrop" hidden></div>

<!-- filled in by js/artifact.js from ?id= in the URL -->
<main class="stage">
    <div class="info-card">
        <div class="info-panel">
            <p class="eyebrow"></p>
            <h1 class="display"></h1>
            <blockquote class="info-text"></blockquote>
            <button class="btn ar-btn" type="button">AR EXPERIENCE</button>
        </div>
    </div>

    <model-viewer
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        touch-action="pan-y"
        interaction-prompt="none"
        tone-mapping="neutral"
        shadow-intensity="1"
        auto-rotate
        rotation-per-second="25deg">
    </model-viewer>

    <p class="plate"></p>
</main>

</body>
</html>
